en:
  discourse_crm:
    sync_activity:
      errors:
        malformed_id: "Invalid Salesforce record ID"
        provider_code: "The CRM returned %{code}."
        locked_record: "Salesforce could not lock the record because it was in use."
        unavailable_object: "Salesforce could not access the requested object. Check the object type and the integration user’s permissions."
        duplicate_detected: "Salesforce blocked this sync because a duplicate rule found a possible matching record. Review the matching records and duplicate rules in Salesforce."
        duplicate_value: "A value must be unique, but another CRM record already uses it."
        validation_rule: "A Salesforce validation rule rejected this record. Review the validation rules for this CRM object."
        field_not_writable: "A mapped Salesforce field cannot be written. Check the field’s permissions and whether it is read-only."
        value_too_long: "A mapped value exceeds the CRM field’s maximum length."
        invalid_email: "Invalid email"
        invalid_number: "A mapped value is not a valid number."
        invalid_date: "A mapped value is not a valid date."
        invalid_option_property: "Invalid option for %{property}. Check the mapping or source value."
        invalid_option: "A mapped value is not one of the CRM property’s allowed options."
        missing_property: "A mapped property does not exist in the CRM."
        required_property: "A required CRM property is missing."
        read_only: "A mapped CRM property is read-only."
        validation: "The CRM rejected one or more mapped values. Check required fields, field types, and allowed options."
        missing_contact: "The linked contact is unavailable. Restore it or create a replacement in the CRM, then retry."
        authentication: "The CRM rejected the credentials. Check the integration credentials in Settings."
        rate_limit: "The CRM request limit was reached."
        quota: "The daily CRM API quota is exhausted. Wait for the quota to reset before retrying."
        ambiguous: "Multiple CRM records match this user’s email. Resolve the duplicate records before retrying."
        conversion: "The converted lead could not be linked to its contact. Check the existing CRM links."
        configuration: "The sync configuration is invalid or its connection has changed. Review and save the configuration."
        timeout: "The CRM request timed out before the result was confirmed."
        connection: "Could not connect to the CRM."
        permissions: "The CRM denied access. Check the integration’s object and field permissions."
        not_found: "The requested CRM record or endpoint was not found."
        temporary: "The CRM returned a server error."
        salesforce_unconfirmed: "Salesforce did not confirm which record was saved. Check the individual retry for this user."
        hubspot_unconfirmed: "HubSpot did not confirm the sync result. No specific reason was recorded. Check later attempts to see whether a retry succeeded."
        contact_search_limit: "The contact search reached HubSpot’s result limit before the sync could advance to a later modification time."
        batch_rejected: "HubSpot rejected the batch without identifying a specific error for this contact."
        unexpected_company: "HubSpot returned a company that did not match any requested company ID."
        conflicting_company_ids: "HubSpot returned two companies for the same requested company ID."
        incomplete_company_batch_read: "HubSpot returned an incomplete set of company records. The company lookup could not finish."
        batch_read: "HubSpot returned an incomplete or unexpected response when reading contacts. The sync could not continue."
        batch_write: "HubSpot did not return a completed batch result. Some contacts may have been saved. Check later attempts for the result of individual retries."
        batch_unconfirmed: "HubSpot did not confirm this contact in the batch response. Check later attempts for the result of an individual retry."
        unknown: "The sync failed, but no specific reason was recorded. Check later attempts to see whether a retry succeeded."
  site_settings:
    salesforce_leads_enabled: "Enable Salesforce Lead lookups, creation, conversion sync, feed items, and association cleanup. Disable for Salesforce organizations where the integration user cannot access Leads. Contact operations continue and existing Lead links are retained."
    enable_guided_sync_configuration: "Send Discourse user data to Salesforce or HubSpot using configurable field mappings, group membership, and a refresh schedule."
    crm_sync_activity_retention_days: "Number of days to keep CRM sync activity. Set to 0 to keep the full history."
    salesforce_enabled: 'Enable the discourse-salesforce plugin'
    salesforce_login_enabled: 'Enable Salesforce Social Login'
    salesforce_consumer_key: "Salesforce connected app's consumer key"
    salesforce_client_secret: "Salesforce connected app's client secret"
    salesforce_server_key_contents: "Contents of the server.key file containing the Salesforce connected app's RSA private key"
    salesforce_authorization_server_url: "Salesforce authorization server's URL"
    salesforce_username: "Salesforce account username"
    salesforce_contact_auto_create_on_signup: "Automatically create a Salesforce Contact for new users when no Contact or Lead matches their email. Contacts are created once the user's email is confirmed."
    salesforce_contact_sync_mode: "Choose how selected Salesforce Contact fields are synchronized when a Discourse user matches an existing Contact. Matching Leads are linked but never updated."
    salesforce_contact_sync_fields: "Salesforce Contact fields populated from the Discourse user when {{setting:salesforce_contact_sync_mode}} is set to fill blank or overwrite. Description contains the Discourse profile URL."
    salesforce_max_feed_items_per_day: "Maximum number of topic replies posted per day as feed items or case comments on each Salesforce object (Case/Lead/Contact). The first post of a topic is always posted. Use -1 for no limit or 0 to post only the first post."
    salesforce_feed_item_visibility: "Visibility of feed items and case comments posted to Salesforce."
    salesforce_allow_moderators_to_create_cases: "Allow moderators to create and manually sync Salesforce cases for topics they can see. When disabled, only admins can create and manually sync cases."
    salesforce_case_unlink_allowed_groups: "Choose whether admins, moderators, or both can unlink Salesforce cases from topics they can see. Empty disables unlinking for everyone, including admins. The case remains in Salesforce. Case and automatic sync tags are removed from the topic."
    salesforce_contact_unlink_allowed_groups: "Choose whether admins, moderators, or both can unlink Salesforce contacts from posts in topics they can see. Empty disables contact unlinking for everyone, including admins. The Salesforce record is retained. Automatic synchronization may link the user again."
    salesforce_case_tag_name: "Tag name to add in topics with a Salesforce case"
    salesforce_case_status_tag_enabled: "Enable to add tags based on Salesforce case status"
    salesforce_case_status_tag_prefix: "Prefix to add before Salesforce case status tags. For example, if prefix is 'case' then the tags will be added like case-open, case-closed, etc."
    salesforce_case_origin: "Case Origin sent on new Salesforce Cases. Leave blank to not send it."
    salesforce_lead_source: "Lead source sent when creating Salesforce Contacts and Leads, and when {{setting:salesforce_contact_sync_fields}} includes it. Leave blank to omit the field."
    salesforce_send_rendered_post_content: "When enabled, send post content to Salesforce as rendered plain text: markdown syntax is removed and every link, image, and attachment becomes a full URL. When disabled, the raw markdown source is sent."
    salesforce_skip_contact_creation_on_case_sync: "Skip creation of Salesforce Contact during Case sync"
    salesforce_default_contact_id_for_case_sync: "Default Salesforce Contact ID to use during Case sync. Useful when 'salesforce_skip_contact_creation_on_case_sync' is enabled."
    salesforce_auth_verbose_logging: "Show verbose Salesforce authentication logs in /logs for troubleshooting"
    hubspot_enabled: "Enable the HubSpot integration. Requires {{setting:hubspot_portal_id}} and {{setting:hubspot_access_token}}."
    hubspot_portal_id: "HubSpot portal (hub) ID, found in the HubSpot account settings."
    hubspot_access_token: "HubSpot service key or private app access token used to authenticate API requests. Requires contact read and write scopes for guided sync."
  salesforce:
    discourse_workflows:
      record:
        invalid_object: "\"%{value}\" is not a valid Salesforce object name"
        invalid_field: "\"%{value}\" is not a valid Salesforce field name"
        invalid_record_id: "\"%{value}\" is not a valid Salesforce record ID"
        no_fields: "Add at least one field to update"
        missing_value: "\"%{field}\" has no value"
        request_failed: "Could not reach Salesforce: %{message}"
      records:
        unknown_provider: "\"%{value}\" does not pull records from a CRM"
        unknown_object: "\"%{value}\" is not an object the pull keeps"
    error:
      connection:
        authentication: "Salesforce authentication failed. Check the API credentials and the integration user’s app authorization, then retry."
        permissions: "Salesforce denied access. Check the integration user’s object and field permissions, then retry."
        rate_limit: "Salesforce’s API request limit was reached. Try again later."
        temporary: "Salesforce could not be reached or is temporarily unavailable. Try again shortly."
        invalid_response: "Salesforce returned an unexpected response. Check the server logs for details, then retry."
      contact_link_changed: "The Salesforce contact association has changed. Refresh the page and review it before unlinking."
      fields_unavailable: "Could not load Salesforce fields. Check the connection and permissions, then try again."
      ambiguous_email_match: "Multiple Salesforce %{object_name} records have the same email"
      invalid_response: "Invalid response from Salesforce API"
      invalid_client_credentials: "There was an issue with the Salesforce credentials. Please confirm the validity of the Salesforce consumer key and client secret settings"
  hubspot:
    error:
      invalid_property_value: "The value mapped to HubSpot property %{property} is not an allowed option. Correct the mapping and save again."
      connection:
        authentication: "HubSpot authentication failed. Check the access token and confirm that the portal ID matches its account, then retry."
        permissions: "HubSpot denied access. Check the token’s contact, company and property scopes, then retry."
        rate_limit: "HubSpot’s API request limit was reached. Try again later."
        temporary: "HubSpot could not be reached or is temporarily unavailable. Try again shortly."
        invalid_response: "HubSpot returned an unexpected response. Check the server logs for details, then retry."
      invalid_response: "Invalid response from HubSpot API"
  dashboard:
    problem:
      salesforce_invalid_credentials: "There was an issue with the Salesforce credentials. Please confirm the validity of the Salesforce consumer key and client secret settings"
      salesforce_app_not_approved: "The Discourse connected app is not yet authorized in Salesforce by the user mentioned in site setting `salesforce_username`. Please follow <a href='%{base_path}/salesforce/admin/authorize'>this link</a> to authorize it."
